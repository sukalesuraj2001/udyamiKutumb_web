<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="https://udyamicircle.in/assets/logo-BWGNLCfH.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Udyami Bharat</title>
  <script>
    // Apply the saved theme before first paint so there is no white flash in dark mode.
    (function () {
      try {
        var m = localStorage.getItem("udyami-theme");
        var dark = m === "dark" || ((m !== "light") && window.matchMedia("(prefers-color-scheme: dark)").matches);
        var r = document.documentElement;
        if (dark) r.classList.add("dark");
        r.setAttribute("data-theme", dark ? "dark" : "light");
        r.style.colorScheme = dark ? "dark" : "light";
      } catch (e) { }
    })();
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>

</html>
